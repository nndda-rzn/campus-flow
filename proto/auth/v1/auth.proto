syntax = "proto3";

package campusflow.auth.v1;

option go_package = "campus-flow/proto/gen/auth/v1;authv1";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // Admin user management.
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc GetUser(GetUserRequest) returns (UserItemResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UserItemResponse);
  rpc SetUserStatus(SetUserStatusRequest) returns (UserItemResponse);
  rpc AssignUserRole(AssignUserRoleRequest) returns (UserItemResponse);
  rpc ListUsersByRole(ListUsersByRoleRequest) returns (ListUsersResponse);

  // Audit log query (Epic 4).
  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse);

  // Self-service password change (Epic 8).
  rpc ChangePassword(ChangePasswordRequest) returns (ChangePasswordResponse);
}

message RegisterRequest {
  string full_name = 1;
  string email = 2;
  string password = 3;
  string role = 4;
}

message RegisterResponse {
  string user_id = 1;
  string full_name = 2;
  string email = 3;
  string role = 4;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string access_token = 1;
  string refresh_token = 2;
  UserProfile user = 3;
}

message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  string refresh_token = 2;
}

message ValidateTokenRequest {
  string access_token = 1;
}

message ValidateTokenResponse {
  bool valid = 1;
  string user_id = 2;
  string role = 3;
}

message LogoutRequest {
  string refresh_token = 1;
}

message LogoutResponse {
  bool success = 1;
}

message UserProfile {
  string user_id = 1;
  string full_name = 2;
  string email = 3;
  string role = 4;
}

// ─── Admin user management ──────────────────────────────────────────────────

message UserItem {
  string id = 1;
  string full_name = 2;
  string email = 3;
  string role = 4;
  string status = 5;
  string created_at = 6;
  string updated_at = 7;
}

message UserItemResponse {
  UserItem user = 1;
}

message ListUsersRequest {
  string role_filter = 1;   // optional, empty = all roles
  string status_filter = 2; // optional, empty = all statuses
  string search = 3;        // optional, matches email or full_name
}

message ListUsersResponse {
  repeated UserItem users = 1;
}

message GetUserRequest {
  string user_id = 1;
}

message UpdateUserRequest {
  string user_id = 1;
  string full_name = 2;
  string email = 3;
}

message SetUserStatusRequest {
  string user_id = 1;
  string status = 2; // ACTIVE | INACTIVE
}

message AssignUserRoleRequest {
  string user_id = 1;
  string role = 2;
  string actor_user_id = 3;
}

message ListUsersByRoleRequest {
  string role = 1;
}

message ListAuditLogsRequest {
  string actor_user_id = 1; // optional filter
  string action = 2;        // optional filter
  string entity_type = 3;   // optional filter
  int32 limit = 4;          // default 100, max 500
}

message AuditLogItem {
  string id = 1;
  string actor_user_id = 2;
  string action = 3;
  string entity_type = 4;
  string entity_id = 5;
  string metadata_json = 6;
  string created_at = 7;
  string source_service = 8; // 'auth' or 'academic'
}

message ListAuditLogsResponse {
  repeated AuditLogItem items = 1;
}

message ChangePasswordRequest {
  string user_id = 1;
  string current_password = 2;
  string new_password = 3;
}

message ChangePasswordResponse {
  bool success = 1;
}