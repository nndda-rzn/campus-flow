syntax = "proto3";

package campusflow.academic.v1;

option go_package = "campus-flow/proto/gen/academic/v1;academicv1";

service AcademicService {
  rpc ListAcademicServices(ListAcademicServicesRequest) returns (ListAcademicServicesResponse);
  rpc CreateAcademicRequest(CreateAcademicRequestRequest) returns (AcademicRequestResponse);
  rpc GetAcademicRequest(GetAcademicRequestRequest) returns (AcademicRequestResponse);
  rpc GetAcademicRequestHistory(GetAcademicRequestHistoryRequest) returns (GetAcademicRequestHistoryResponse);
  rpc ListMyAcademicRequests(ListMyAcademicRequestsRequest) returns (ListAcademicRequestsResponse);
  rpc ListAllAcademicRequests(ListAllAcademicRequestsRequest) returns (ListAcademicRequestsResponse);

  rpc VerifyAcademicRequest(WorkflowActionRequest) returns (AcademicRequestResponse);
  rpc ApproveAcademicRequest(WorkflowActionRequest) returns (AcademicRequestResponse);
  rpc RejectAcademicRequest(WorkflowActionRequest) returns (AcademicRequestResponse);
  rpc CompleteAcademicRequest(WorkflowActionRequest) returns (AcademicRequestResponse);
  rpc CancelAcademicRequest(WorkflowActionRequest) returns (AcademicRequestResponse);
  rpc SubmitAcademicRequest(WorkflowActionRequest) returns (AcademicRequestResponse);
  rpc RequestRevisionAcademicRequest(WorkflowActionRequest) returns (AcademicRequestResponse);
  rpc UpdateAcademicRequest(UpdateAcademicRequestRequest) returns (AcademicRequestResponse);


  rpc ListLecturers(ListLecturersRequest) returns (ListLecturersResponse);
  rpc CreateSupervisorRequest(CreateSupervisorRequestRequest) returns (SupervisorRequestResponse);
  rpc ListMySupervisorRequests(ListMySupervisorRequestsRequest) returns (ListSupervisorRequestsResponse);
  rpc ListAllSupervisorRequests(ListAllSupervisorRequestsRequest) returns (ListSupervisorRequestsResponse);
  rpc ListLecturerSupervisorRequests(ListLecturerSupervisorRequestsRequest) returns (ListSupervisorRequestsResponse);
  rpc VerifySupervisorRequest(SupervisorWorkflowActionRequest) returns (SupervisorRequestResponse);
  rpc RequestRevisionSupervisorRequest(SupervisorWorkflowActionRequest) returns (SupervisorRequestResponse);
  rpc AssignSupervisor(AssignSupervisorRequest) returns (SupervisorRequestResponse);
  rpc AcceptSupervisorRequest(SupervisorWorkflowActionRequest) returns (SupervisorRequestResponse);
  rpc RejectSupervisorRequest(SupervisorWorkflowActionRequest) returns (SupervisorRequestResponse);
  rpc CompleteSupervisorRequest(SupervisorWorkflowActionRequest) returns (SupervisorRequestResponse);
  rpc CancelSupervisorRequest(SupervisorWorkflowActionRequest) returns (SupervisorRequestResponse);

  // Directory management (Epic 2): students, lecturers, departments.
  rpc ListDepartments(ListDepartmentsRequest) returns (ListDepartmentsResponse);
  rpc CreateDepartment(CreateDepartmentRequest) returns (DepartmentItemResponse);
  rpc UpdateDepartment(UpdateDepartmentRequest) returns (DepartmentItemResponse);

  rpc ListStudents(ListStudentsRequest) returns (ListStudentsResponse);
  rpc UpsertStudent(UpsertStudentRequest) returns (StudentItemResponse);
  rpc SetStudentStatus(SetStudentStatusRequest) returns (StudentItemResponse);
  rpc BulkImportStudents(BulkImportStudentsRequest) returns (BulkImportStudentsResponse);

   rpc ListAllLecturers(ListAllLecturersRequest) returns (ListLecturersResponse);
   rpc UpsertLecturer(UpsertLecturerRequest) returns (LecturerItemResponse);
   rpc SetLecturerStatus(SetLecturerStatusRequest) returns (LecturerItemResponse);
   rpc BulkImportLecturers(BulkImportLecturersRequest) returns (BulkImportLecturersResponse);

   // Lecturer self-service (Tahap 3a)
   rpc GetLecturerProfile(GetLecturerProfileRequest) returns (LecturerProfileResponse);
   rpc UpdateLecturerProfile(UpdateLecturerProfileRequest) returns (LecturerProfileResponse);
   rpc GetLecturerDashboard(GetLecturerDashboardRequest) returns (GetLecturerDashboardResponse);
   rpc GetLecturerQuota(GetLecturerQuotaRequest) returns (GetLecturerQuotaResponse);

   // Audit log query (Epic 4).
  rpc ListAuditLogs(ListAuditLogsRequest) returns (ListAuditLogsResponse);

  // Announcements (Epic 9 / FR-252).
  rpc ListAnnouncements(ListAnnouncementsRequest) returns (ListAnnouncementsResponse);
  rpc CreateAnnouncement(CreateAnnouncementRequest) returns (AnnouncementItemResponse);
  rpc UpdateAnnouncement(UpdateAnnouncementRequest) returns (AnnouncementItemResponse);
  rpc DeactivateAnnouncement(DeactivateAnnouncementRequest) returns (AnnouncementItemResponse);

  // Academic years (Epic 10a / FR-278).
  rpc ListAcademicYears(ListAcademicYearsRequest) returns (ListAcademicYearsResponse);
  rpc GetActiveAcademicYear(GetActiveAcademicYearRequest) returns (AcademicYearResponse);
  rpc CreateAcademicYear(CreateAcademicYearRequest) returns (AcademicYearResponse);
  rpc SetActiveAcademicYear(SetActiveAcademicYearRequest) returns (AcademicYearResponse);

  // Departmental scopes (Epic 10a / FR-277).
  rpc GetUserScope(GetUserScopeRequest) returns (UserScopeResponse);
  rpc SetUserScope(SetUserScopeRequest) returns (UserScopeResponse);

  // Request comments (Epic 10b / FR-260).
  rpc ListRequestComments(ListRequestCommentsRequest) returns (ListRequestCommentsResponse);
  rpc CreateRequestComment(CreateRequestCommentRequest) returns (RequestCommentResponse);

  // Bulk verify academic requests (Epic 10b / FR-255).
  rpc BulkVerifyAcademicRequests(BulkVerifyAcademicRequestsRequest) returns (BulkVerifyAcademicRequestsResponse);

  // Thesis Progress
  rpc GetMilestonesByDepartment(GetMilestonesByDepartmentRequest) returns (GetMilestonesByDepartmentResponse);
  rpc GetProgressByStudent(GetProgressByStudentRequest) returns (GetProgressByStudentResponse);
  rpc UpdateProgress(UpdateProgressRequest) returns (ThesisProgressResponse);

  // Guidance Logs
  rpc GetLogsByStudent(GetLogsByStudentRequest) returns (GetLogsResponse);
  rpc GetLogsByLecturer(GetLogsByLecturerRequest) returns (GetLogsResponse);
  rpc GetLogByID(GetLogByIDRequest) returns (GuidanceLogResponse);
  rpc CreateLog(CreateLogRequest) returns (GuidanceLogResponse);
  rpc UpdateLog(UpdateLogRequest) returns (GuidanceLogResponse);
  rpc DeleteLog(DeleteLogRequest) returns (DeleteLogResponse);
  
  // Enhanced Guidance Logs (Lecturer)
  rpc UpdateLogNotes(UpdateGuidanceLogNotesRequest) returns (GuidanceLogResponse);
  rpc AttachFileToLog(AttachFileToLogRequest) returns (GuidanceLogResponse);
  rpc RemoveAttachment(RemoveAttachmentRequest) returns (GuidanceLogResponse);

  // Academic Calendar
  rpc GetEvents(GetEventsRequest) returns (GetEventsResponse);
  rpc CreateEvent(CreateEventRequest) returns (AcademicCalendarResponse);
  rpc UpdateEvent(UpdateEventRequest) returns (AcademicCalendarResponse);
  rpc DeleteEvent(DeleteEventRequest) returns (DeleteEventResponse);

  // FAQ
  rpc GetCategories(GetCategoriesRequest) returns (GetCategoriesResponse);
  rpc GetFAQs(GetFAQsRequest) returns (GetFAQsResponse);
  rpc CreateFAQ(CreateFAQRequest) returns (FAQResponse);
  rpc UpdateFAQ(UpdateFAQRequest) returns (FAQResponse);
  rpc DeleteFAQ(DeleteFAQRequest) returns (DeleteFAQResponse);

  // Thesis Milestones (Admin)
  rpc CreateMilestone(CreateMilestoneRequest) returns (MilestoneResponse);
  rpc UpdateMilestone(UpdateMilestoneRequest) returns (MilestoneResponse);
  rpc DeleteMilestone(DeleteMilestoneRequest) returns (DeleteMilestoneResponse);

  // Thesis Progress (Lecturer View)
  rpc ListSupervisedProgress(ListSupervisedProgressRequest) returns (ListSupervisedProgressResponse);
  rpc GetStudentProgressDetail(GetStudentProgressDetailRequest) returns (SupervisedStudentProgress);
  rpc CompleteMilestone(CompleteMilestoneRequest) returns (ThesisProgressResponse);

  // Consultation Scheduling (Lecturer)
  rpc ListConsultationSlots(ListConsultationSlotsRequest) returns (ListConsultationSlotsResponse);
  rpc CreateConsultationSlot(CreateConsultationSlotRequest) returns (ConsultationSlotResponse);
  rpc UpdateConsultationSlot(UpdateConsultationSlotRequest) returns (ConsultationSlotResponse);
  rpc CancelConsultationSlot(CancelConsultationSlotRequest) returns (ConsultationSlotResponse);
  rpc ListLecturerBookings(ListLecturerBookingsRequest) returns (ListConsultationBookingsResponse);
  rpc ApproveBooking(BookingActionRequest) returns (ConsultationBookingResponse);
  rpc RejectBooking(BookingActionRequest) returns (ConsultationBookingResponse);
  rpc RescheduleBooking(RescheduleBookingRequest) returns (ConsultationBookingResponse);

  // Consultation Scheduling (Student)
  rpc ListAvailableSlots(ListAvailableSlotsRequest) returns (ListConsultationSlotsResponse);
  rpc ListStudentBookings(ListStudentBookingsRequest) returns (ListConsultationBookingsResponse);
  rpc CreateBooking(CreateBookingRequest) returns (ConsultationBookingResponse);
  rpc CancelBooking(CancelBookingRequest) returns (ConsultationBookingResponse);
  rpc AcceptReschedule(AcceptRescheduleRequest) returns (ConsultationBookingResponse);

  // Thesis Final Document Review (Lecturer) - Tahap 4
  rpc ListLecturerFinalDocuments(ListLecturerFinalDocumentsRequest) returns (ListThesisFinalDocumentsResponse);
  rpc GetThesisFinalDocument(GetThesisFinalDocumentRequest) returns (ThesisFinalDocumentResponse);
  rpc StartFinalDocumentReview(FinalDocumentActionRequest) returns (ThesisFinalDocumentResponse);
  rpc ApproveFinalDocument(FinalDocumentActionRequest) returns (ThesisFinalDocumentResponse);
  rpc RequestRevisionFinalDocument(FinalDocumentActionRequest) returns (ThesisFinalDocumentResponse);
  rpc RejectFinalDocument(FinalDocumentActionRequest) returns (ThesisFinalDocumentResponse);

  // Note Templates (Admin Prodi)
  rpc ListNoteTemplates(ListNoteTemplatesRequest) returns (ListNoteTemplatesResponse);
  rpc CreateNoteTemplate(CreateNoteTemplateRequest) returns (NoteTemplateResponse);
  rpc UpdateNoteTemplate(UpdateNoteTemplateRequest) returns (NoteTemplateResponse);
  rpc DeleteNoteTemplate(DeleteNoteTemplateRequest) returns (DeleteNoteTemplateResponse);
  rpc IncrementTemplateUsage(IncrementTemplateUsageRequest) returns (NoteTemplateResponse);

  // Thesis Overview (Admin Prodi)
  rpc ListDepartmentThesisOverview(ListDepartmentThesisOverviewRequest) returns (ListDepartmentThesisOverviewResponse);
}

message ListAcademicServicesRequest {}

message AcademicServiceItem {
  string id = 1;
  string code = 2;
  string name = 3;
  string description = 4;
  bool is_active = 5;
}

message ListAcademicServicesResponse {
  repeated AcademicServiceItem services = 1;
}

message CreateAcademicRequestRequest {
  string student_user_id = 1;
  string service_code = 2;
  string title = 3;
  string description = 4;
}

message GetAcademicRequestRequest {
  string request_id = 1;
}

message GetAcademicRequestHistoryRequest {
  string request_id = 1;
}

message RequestStatusHistoryItem {
  string id = 1;
  string request_id = 2;
  string old_status = 3;
  string new_status = 4;
  string actor_user_id = 5;
  string note = 6;
  string created_at = 7;
}

message GetAcademicRequestHistoryResponse {
  repeated RequestStatusHistoryItem histories = 1;
}

message ListMyAcademicRequestsRequest {
  string student_user_id = 1;
}

message ListAllAcademicRequestsRequest {
  string status_filter = 1; // opsional, kosong = semua status
}

message WorkflowActionRequest {
  string request_id = 1;
  string actor_user_id = 2;
  string note = 3;
}

message UpdateAcademicRequestRequest {
  string request_id = 1;
  string actor_user_id = 2;
  string title = 3;
  string description = 4;
}

message AcademicRequest {
  string id = 1;
  string request_number = 2;
  string student_user_id = 3;
  string academic_service_id = 4;
  string service_code = 5;
  string service_name = 6;
  string title = 7;
  string description = 8;
  string status = 9;
  string created_at = 10;
  string updated_at = 11;
  string due_at = 12;       // SLA target deadline (FR-254)
  string verified_at = 13;
  string approved_at = 14;
  string completed_at = 15;
  string academic_year_id = 16;   // FR-278
  string academic_year_code = 17;
}

message AcademicRequestResponse {
  AcademicRequest request = 1;
}

message ListAcademicRequestsResponse {
  repeated AcademicRequest requests = 1;
}

message ListLecturersRequest {}

message ListLecturersResponse {
  repeated LecturerItem lecturers = 1;
}

message CreateSupervisorRequestRequest {
  string student_user_id = 1;
  string topic_title = 2;
  string topic_description = 3;
  repeated string lecturer_ids = 4;
}

message ListMySupervisorRequestsRequest {
  string student_user_id = 1;
}

message ListAllSupervisorRequestsRequest {
  string status_filter = 1; // opsional, kosong = semua status
}

message ListLecturerSupervisorRequestsRequest {
  string lecturer_user_id = 1;
  int32 page = 2;
  int32 page_size = 3;
  string status_filter = 4;
}

message SupervisorWorkflowActionRequest {
  string request_id = 1;
  string actor_user_id = 2;
  string note = 3;
}

message AssignSupervisorRequest {
  string request_id = 1;
  string actor_user_id = 2;
  string lecturer_id = 3;
  string note = 4;
}

message SupervisorChoice {
  string lecturer_id = 1;
  string lecturer_name = 2;
  int32 priority = 3;
}

message SupervisorRequest {
  string id = 1;
  string request_number = 2;
  string student_user_id = 3;
  string topic_title = 4;
  string topic_description = 5;
  string status = 6;
  string assigned_lecturer_id = 7;
  string assigned_lecturer_name = 8;
  repeated SupervisorChoice choices = 9;
  string created_at = 10;
  string updated_at = 11;
}

message SupervisorRequestResponse {
  SupervisorRequest request = 1;
}

message ListSupervisorRequestsResponse {
  repeated SupervisorRequest requests = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

// ─── Directory: Departments, Students, Lecturers (Epic 2) ───────────────────

message DepartmentItem {
  string id = 1;
  string code = 2;
  string name = 3;
  string created_at = 4;
}

message DepartmentItemResponse {
  DepartmentItem department = 1;
}

message ListDepartmentsRequest {}

message ListDepartmentsResponse {
  repeated DepartmentItem departments = 1;
}

message CreateDepartmentRequest {
  string code = 1;
  string name = 2;
}

message UpdateDepartmentRequest {
  string id = 1;
  string code = 2;
  string name = 3;
}

message StudentItem {
  string id = 1;
  string user_id = 2;
  string nim = 3;
  string full_name = 4;
  string email = 5;
  string department_id = 6;
  string department_name = 7;
  string status = 8;
  string created_at = 9;
  string updated_at = 10;
}

message StudentItemResponse {
  StudentItem student = 1;
}

message ListStudentsRequest {
  string status_filter = 1; // optional
  string search = 2;        // matches NIM, name, or email
}

message ListStudentsResponse {
  repeated StudentItem students = 1;
}

message UpsertStudentRequest {
  string user_id = 1;       // required: link to auth user
  string nim = 2;
  string full_name = 3;
  string email = 4;
  string department_id = 5; // optional
}

message SetStudentStatusRequest {
  string user_id = 1; // we identify by user_id since admin keys students by it
  string status = 2;  // ACTIVE | INACTIVE | PENDING_BIND
}

message LecturerItem {
  string id = 1;
  string user_id = 2;
  string nidn = 3;
  string full_name = 4;
  string email = 5;
  string department_id = 6;
  string department_name = 7;
  string status = 8;
  int32 max_supervisor_quota = 9;
  string created_at = 10;
  string updated_at = 11;
}

message LecturerItemResponse {
  LecturerItem lecturer = 1;
}

message ListAllLecturersRequest {
  string status_filter = 1;
  string search = 2;
}

message UpsertLecturerRequest {
  string user_id = 1;
  string nidn = 2;
  string full_name = 3;
  string email = 4;
  string department_id = 5;
  int32 max_supervisor_quota = 6;
}

message SetLecturerStatusRequest {
  string user_id = 1;
  string status = 2;
}

// Lecturer self-service messages (Tahap 3a)
message GetLecturerProfileRequest {
  string user_id = 1;
}

message LecturerProfileResponse {
  string id = 1;
  string user_id = 2;
  string nidn = 3;
  string full_name = 4;
  string email = 5;
  string department_id = 6;
  string department_name = 7;
  string status = 8;
  int32 max_supervisor_quota = 9;
  int32 current_quota_used = 10;
  string created_at = 11;
  string updated_at = 12;
}

message UpdateLecturerProfileRequest {
  string user_id = 1;
  string full_name = 2;
  string email = 3;
  string nidn = 4;
}

message GetLecturerDashboardRequest {
  string user_id = 1;
}

message SupervisorRequestSummary {
  string id = 1;
  string student_name = 2;
  string topic_title = 3;
  string status = 4;
  string created_at = 5;
}

message ConsultationBookingSummary {
  string id = 1;
  string student_name = 2;
  string topic = 3;
  string slot_date = 4;
  string start_time = 5;
}

message GetLecturerDashboardResponse {
  int32 total_supervised_students = 1;
  int32 pending_supervisor_requests = 2;
  int32 pending_consultation_bookings = 3;
  int32 quota_used = 4;
  int32 quota_max = 5;
  repeated SupervisorRequestSummary recent_requests = 6;
  repeated ConsultationBookingSummary pending_bookings = 7;
}

message GetLecturerQuotaRequest {
  string user_id = 1;
  string academic_year_id = 2;
}

message QuotaDetail {
  string student_name = 1;
  string request_id = 2;
  string status = 3;
}

message GetLecturerQuotaResponse {
  string academic_year_id = 1;
  string academic_year_name = 2;
  int32 max_quota = 3;
  int32 current_used = 4;
  int32 available = 5;
  repeated QuotaDetail details = 6;
}

// ─── Bulk import (Epic 11a / FR-275, FR-276) ────────────────────────────────

message StudentImportRow {
  string user_id = 1;
  string email = 2;
  string nim = 3;
  string full_name = 4;
  string department_code = 5;
}

message LecturerImportRow {
  string user_id = 1;
  string email = 2;
  string nidn = 3;
  string full_name = 4;
  string department_code = 5;
  int32 max_supervisor_quota = 6;
}

message BulkImportResultRow {
  int32 row_number = 1;
  string identifier = 2;     // email or NIM/NIDN — for display
  string outcome = 3;        // CREATED | UPDATED | SKIPPED | ERROR
  string error = 4;          // populated only when outcome = ERROR
}

message BulkImportStudentsRequest {
  repeated StudentImportRow rows = 1;
  bool dry_run = 2;
}

message BulkImportStudentsResponse {
  repeated BulkImportResultRow results = 1;
  int32 created = 2;
  int32 updated = 3;
  int32 skipped = 4;
  int32 errors = 5;
}

message BulkImportLecturersRequest {
  repeated LecturerImportRow rows = 1;
  bool dry_run = 2;
}

message BulkImportLecturersResponse {
  repeated BulkImportResultRow results = 1;
  int32 created = 2;
  int32 updated = 3;
  int32 skipped = 4;
  int32 errors = 5;
}

// ─── Audit logs (Epic 4) ────────────────────────────────────────────────────

message ListAuditLogsRequest {
  string actor_user_id = 1;
  string action = 2;
  string entity_type = 3;
  int32 limit = 4;
}

message AuditLogItem {
  string id = 1;
  string actor_user_id = 2;
  string action = 3;
  string entity_type = 4;
  string entity_id = 5;
  string metadata_json = 6;
  string created_at = 7;
  string source_service = 8;
}

message ListAuditLogsResponse {
  repeated AuditLogItem items = 1;
}

// ─── Announcements (Epic 9 / FR-252) ────────────────────────────────────────

message AnnouncementItem {
  string id = 1;
  string title = 2;
  string body = 3;
  string severity = 4;            // INFO | WARNING | CRITICAL | SUCCESS
  string author_user_id = 5;
  string author_name = 6;
  repeated string target_roles = 7; // empty = visible to all roles
  bool is_active = 8;
  string starts_at = 9;
  string ends_at = 10;
  string created_at = 11;
  string updated_at = 12;
}

message AnnouncementItemResponse {
  AnnouncementItem announcement = 1;
}

message ListAnnouncementsRequest {
  string viewer_role = 1;   // filter to announcements visible to this role
  bool include_inactive = 2;
}

message ListAnnouncementsResponse {
  repeated AnnouncementItem items = 1;
}

message CreateAnnouncementRequest {
  string title = 1;
  string body = 2;
  string severity = 3;
  string author_user_id = 4;
  string author_name = 5;
  repeated string target_roles = 6;
  string starts_at = 7;
  string ends_at = 8;
}

message UpdateAnnouncementRequest {
  string id = 1;
  string title = 2;
  string body = 3;
  string severity = 4;
  repeated string target_roles = 5;
  string ends_at = 6;
}

message DeactivateAnnouncementRequest {
  string id = 1;
}

// ─── Academic years (Epic 10a / FR-278) ────────────────────────────────────

message AcademicYearItem {
  string id = 1;
  string code = 2;
  string name = 3;
  string start_date = 4;
  string end_date = 5;
  bool is_active = 6;
  string created_at = 7;
  string updated_at = 8;
}

message AcademicYearResponse {
  AcademicYearItem year = 1;
}

message ListAcademicYearsRequest {}

message ListAcademicYearsResponse {
  repeated AcademicYearItem items = 1;
}

message GetActiveAcademicYearRequest {}

message CreateAcademicYearRequest {
  string code = 1;
  string name = 2;
  string start_date = 3;
  string end_date = 4;
  bool is_active = 5;
}

message SetActiveAcademicYearRequest {
  string id = 1;
}

// ─── User department scopes (Epic 10a / FR-277) ────────────────────────────

message UserScopeItem {
  string user_id = 1;
  string department_id = 2;
  string department_code = 3;
  string department_name = 4;
}

message UserScopeResponse {
  string user_id = 1;
  repeated UserScopeItem scopes = 2;
}

message GetUserScopeRequest {
  string user_id = 1;
}

message SetUserScopeRequest {
  string user_id = 1;
  repeated string department_ids = 2;
}

// ─── Request comments (Epic 10b / FR-260) ──────────────────────────────────

message RequestCommentItem {
  string id = 1;
  string request_id = 2;
  string request_type = 3;
  string author_user_id = 4;
  string author_name = 5;
  string author_role = 6;
  string body = 7;
  string created_at = 8;
}

message RequestCommentResponse {
  RequestCommentItem comment = 1;
}

message ListRequestCommentsRequest {
  string request_type = 1; // ACADEMIC | SUPERVISOR
  string request_id = 2;
}

message ListRequestCommentsResponse {
  repeated RequestCommentItem items = 1;
}

message CreateRequestCommentRequest {
  string request_type = 1;
  string request_id = 2;
  string author_user_id = 3;
  string author_name = 4;
  string author_role = 5;
  string body = 6;
}

// ─── Bulk verify (Epic 10b / FR-255) ───────────────────────────────────────

message BulkVerifyAcademicRequestsRequest {
  repeated string request_ids = 1;
  string actor_user_id = 2;
  string note = 3;
}

message BulkVerifyResultItem {
  string request_id = 1;
  bool success = 2;
  string error = 3; // populated only when success = false
}

message BulkVerifyAcademicRequestsResponse {
  repeated BulkVerifyResultItem results = 1;
  int32 succeeded = 2;
  int32 failed = 3;
}

// ─── Thesis Milestones & Progress ──────────────────────────────────────────

message ThesisMilestoneItem {
  string id = 1;
  string department_id = 2;
  string code = 3;
  string name = 4;
  string description = 5;
  int32 sequence_order = 6;
  bool is_active = 7;
  string created_at = 8;
  string updated_at = 9;
}

message ThesisProgressItem {
  string id = 1;
  string student_user_id = 2;
  string supervisor_request_id = 3;
  string milestone_id = 4;
  string status = 5;
  string target_date = 6;
  string completed_at = 7;
  string notes = 8;
  string created_at = 9;
  string updated_at = 10;
  string milestone_name = 11;
  string milestone_code = 12;
  int32 sequence_order = 13;
}

message GetMilestonesByDepartmentRequest {
  string department_id = 1;
}

message GetMilestonesByDepartmentResponse {
  repeated ThesisMilestoneItem milestones = 1;
}

message GetProgressByStudentRequest {
  string student_user_id = 1;
}

message GetProgressByStudentResponse {
  repeated ThesisProgressItem progress = 1;
}

message UpdateProgressRequest {
  string id = 1;
  string notes = 2;
  string target_date = 3;
  string status = 4;
}

message ThesisProgressResponse {
  ThesisProgressItem progress = 1;
}

// ─── Guidance Logs ──────────────────────────────────────────────────────────

message GuidanceLogItem {
  string id = 1;
  string student_user_id = 2;
  string supervisor_request_id = 3;
  string lecturer_user_id = 4;
  string session_date = 5;
  string start_time = 6;
  string end_time = 7;
  string topic = 8;
  string discussion_summary = 9;
  string next_action = 10;
  string status = 11;
  string submitted_at = 12;
  string supervisor_feedback = 13;
  string approved_at = 14;
  string created_at = 15;
  string updated_at = 16;
  string student_name = 17;
  string lecturer_name = 18;
  // Enhanced fields
  string lecturer_notes = 19;
  string milestone_id = 20;
  string milestone_name = 21;
  string milestone_code = 22;
  repeated GuidanceLogAttachment attachments = 23;
}

message GuidanceLogAttachment {
  string file_id = 1;
  string filename = 2;
  string uploaded_by = 3;
  string uploaded_by_name = 4;
  string uploaded_at = 5;
}

message GetLogsByStudentRequest {
  string student_user_id = 1;
}

message GetLogsByLecturerRequest {
  string lecturer_user_id = 1;
}

message GetLogsResponse {
  repeated GuidanceLogItem logs = 1;
}

message GetLogByIDRequest {
  string id = 1;
}

message GuidanceLogResponse {
