name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.3"
          cache: true

      - name: Install protoc
        run: |
          PB_VERSION=27.3
          curl -sSL -o /tmp/protoc.zip \
            https://github.com/protocolbuffers/protobuf/releases/download/v${PB_VERSION}/protoc-${PB_VERSION}-linux-x86_64.zip
          sudo unzip -o /tmp/protoc.zip -d /usr/local
          protoc --version

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Generate proto bindings
        run: |
          mkdir -p proto/gen
          protoc \
            --proto_path=proto \
            --go_out=proto/gen --go_opt=paths=source_relative \
            --go-grpc_out=proto/gen --go-grpc_opt=paths=source_relative \
            proto/common/v1/common.proto \
            proto/auth/v1/auth.proto \
            proto/academic/v1/academic.proto \
            proto/file/v1/file.proto \
            proto/notification/v1/notification.proto \
            proto/reporting/v1/reporting.proto

      - name: Vet
        run: |
          go vet ./apps/services/auth-service/...
          go vet ./apps/services/academic-service/...
          go vet ./apps/services/file-service/...
          go vet ./apps/services/notification-service/...
          go vet ./apps/services/reporting-service/...
          go vet ./apps/services/api-gateway/...

      - name: Build
        run: |
          go build ./apps/services/auth-service/...
          go build ./apps/services/academic-service/...
          go build ./apps/services/file-service/...
          go build ./apps/services/notification-service/...
          go build ./apps/services/reporting-service/...
          go build ./apps/services/api-gateway/...

      - name: Test
        run: |
          go test ./apps/services/academic-service/internal/service/... -count=1
          go test ./apps/services/academic-service/cmd/server/... -count=1
          go test ./apps/services/file-service/internal/service/... -count=1

  web:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint --if-present
        continue-on-error: true

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
