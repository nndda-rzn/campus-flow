# Full CampusFlow stack: infra (Postgres, RabbitMQ) + 6 microservices + web.
#
# Run:
#   docker compose -f infra/compose/docker-compose.full.yml up --build
#
# Services bind to host ports for parity with the dev-script setup so the same
# health checks / curl examples in scripts/README work.

services:
  # ─── Infra ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: cf-postgres
    environment:
      POSTGRES_USER: campusflow
      POSTGRES_PASSWORD: campusflow_password
      POSTGRES_DB: campusflow_main
    ports:
      - "5432:5432"
    volumes:
      - cf_pg:/var/lib/postgresql/data
      - ../../infra/postgres/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusflow"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [cf_net]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: cf-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: campusflow
      RABBITMQ_DEFAULT_PASS: campusflow_password
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - cf_rmq:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 8
    networks: [cf_net]

  # ─── Backend services ─────────────────────────────────────────────────────
  auth-service:
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE_PATH: apps/services/auth-service
    container_name: cf-auth
    environment:
      DATABASE_URL: postgres://campusflow:campusflow_password@postgres:5432/auth_db?sslmode=disable
      RABBITMQ_URL: amqp://campusflow:campusflow_password@rabbitmq:5672/
      JWT_SECRET: campusflow_dev_secret_change_me
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:50061/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [cf_net]

  academic-service:
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE_PATH: apps/services/academic-service
    container_name: cf-academic
    environment:
      DATABASE_URL: postgres://campusflow:campusflow_password@postgres:5432/academic_db?sslmode=disable
      RABBITMQ_URL: amqp://campusflow:campusflow_password@rabbitmq:5672/
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [cf_net]

  file-service:
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE_PATH: apps/services/file-service
    container_name: cf-file
    environment:
      DATABASE_URL: postgres://campusflow:campusflow_password@postgres:5432/file_db?sslmode=disable
      RABBITMQ_URL: amqp://campusflow:campusflow_password@rabbitmq:5672/
    volumes:
      - ../../storage/uploads:/app/storage/uploads
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [cf_net]

  notification-service:
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE_PATH: apps/services/notification-service
    container_name: cf-notification
    environment:
      DATABASE_URL: postgres://campusflow:campusflow_password@postgres:5432/notification_db?sslmode=disable
      RABBITMQ_URL: amqp://campusflow:campusflow_password@rabbitmq:5672/
      AUTH_SERVICE_ADDR: auth-service:50051
    depends_on:
      auth-service: { condition: service_started }
      rabbitmq: { condition: service_healthy }
    networks: [cf_net]

  reporting-service:
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE_PATH: apps/services/reporting-service
    container_name: cf-reporting
    environment:
      DATABASE_URL: postgres://campusflow:campusflow_password@postgres:5432/reporting_db?sslmode=disable
      RABBITMQ_URL: amqp://campusflow:campusflow_password@rabbitmq:5672/
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    networks: [cf_net]

  api-gateway:
    build:
      context: ../..
      dockerfile: infra/docker/service.Dockerfile
      args:
        SERVICE_PATH: apps/services/api-gateway
    container_name: cf-gateway
    environment:
      AUTH_SERVICE_ADDR: auth-service:50051
      ACADEMIC_SERVICE_ADDR: academic-service:50052
      FILE_SERVICE_ADDR: file-service:50053
      NOTIFICATION_SERVICE_ADDR: notification-service:50054
      REPORTING_SERVICE_ADDR: reporting-service:50055
    ports:
      - "8080:8080"
    depends_on:
      auth-service: { condition: service_started }
      academic-service: { condition: service_started }
      file-service: { condition: service_started }
      notification-service: { condition: service_started }
      reporting-service: { condition: service_started }
    networks: [cf_net]

  # ─── Frontend ─────────────────────────────────────────────────────────────
  web:
    build:
      context: ../../apps/web
      dockerfile: ../../infra/docker/web.Dockerfile
    container_name: cf-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:3000"
    depends_on:
      api-gateway: { condition: service_started }
    networks: [cf_net]

networks:
  cf_net:
    driver: bridge

volumes:
  cf_pg:
  cf_rmq:
